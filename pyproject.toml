[project]
name = "argus"
version = "0.4.0"
description = "Tool-use research agent over MCP with a hardened execution loop and a 40-task benchmark"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph>=0.2.28",
  "mcp>=1.2",
  "openai>=1.40",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "tenacity>=8.3",
  "structlog>=24.1",
  "typer>=0.12",
  "rich>=13.7",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "matplotlib>=3.9"]

[project.scripts]
argus = "argus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus", "mcp_servers/argus_tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
# B008: o padrão do Typer é `param: T = typer.Option(...)` na assinatura.
# RUF001/2/3: os textos são em português e usam acentos e símbolos como ×.
# ASYNC109/ASYNC240: timeouts explícitos e leitura de arquivo pequeno no bench.
ignore = ["B008", "RUF001", "RUF002", "RUF003", "ASYNC109", "ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true
